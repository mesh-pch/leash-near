[package]
name = "mock_ft"
version = "0.1.0"
edition = "2021"
description = "Minimal NEP-141 token used only to demo/test Leash on testnet"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
