[package]
name = "leash_near"
version = "0.1.0"
edition = "2021"
description = "Leash on NEAR: spending-policy vault for AI agents using function-call keys"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
